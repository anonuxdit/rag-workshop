name: rag-eval

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # rag.evaluate เขียนตารางผลลง $GITHUB_STEP_SUMMARY เอง จึงขึ้นใน Job Summary
      - name: Evaluate retrieval (dev)
        run: python -m rag.evaluate --split dev --method tfidf -k 4 --min-hit 0.9
